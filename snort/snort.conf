# /etc/snort/snort.conf — Tuned for CyberPanel/OpenLiteSpeed VPS

# ── Network ─────────────────────────────────────────────────────
ipvar HOME_NET    203.0.113.10/32
ipvar DOCKER_NET  [172.17.0.0/16,172.18.0.0/16,172.19.0.0/16]
ipvar EXTERNAL_NET !$HOME_NET

portvar HTTP_PORTS   [80,443,8080,8090,7080,8888]
portvar SSH_PORTS    [22]
portvar FTP_PORTS    [21]
portvar MAIL_PORTS   [25,465,587,110,143,993,995]
portvar DNS_PORTS    [53]
portvar DB_PORTS     [3306]

var RULE_PATH        /etc/snort/rules
var LOG_DIR          /var/log/snort

# Dynamic modules (required for preprocessors on Snort 2.9)
dynamicengine /usr/lib/snort/snort_dynamicengine/libsf_engine.so
dynamicdetection directory /usr/lib/snort/snort_dynamicrules
dynamicpreprocessor directory /usr/lib/snort/snort_dynamicpreprocessor

# ── Detection Engine ────────────────────────────────────────────
config checksum_mode: all
config detection: search-method ac-split
config event_queue: max_queue 8, log 5, order_events content_length
config disable_decode_alerts

# ── Preprocessors ───────────────────────────────────────────────
preprocessor stream5_global: track_tcp yes, track_udp yes, track_icmp yes, max_tcp 262144, max_udp 131072, max_icmp 65536, memcap 268435456

preprocessor stream5_tcp: policy linux, detect_anomalies, require_3whs 180, overlap_limit 10

preprocessor stream5_udp: timeout 180
preprocessor stream5_icmp: timeout 180

preprocessor http_inspect: global iis_unicode_map /etc/snort/unicode.map 1252 compress_depth 65535 decompress_depth 65535

preprocessor http_inspect_server: server default profile all

preprocessor ssh: server_ports { 22 } autodetect

preprocessor ssl: ports { 443 465 563 636 989 990 992 993 994 995 8443 }

preprocessor ftp_telnet: global inspection_type stateful
preprocessor ftp_telnet_protocol: telnet normalize
preprocessor ftp_telnet_protocol: ftp server default ports { 21 }
preprocessor ftp_telnet_protocol: ftp client default max_resp_len 256

preprocessor smtp: ports { 25 465 587 }

preprocessor dns: ports { 53 }

# preprocessor sfportscan: proto { all } memcap { 10000000 } sense_level { medium }

# ── Output ──────────────────────────────────────────────────────
output alert_fast:  /var/log/snort/alert.log
output log_tcpdump: /var/log/snort/snort.log
output alert_syslog: LOG_AUTH LOG_ALERT

# ── Rules ───────────────────────────────────────────────────────
include $RULE_PATH/local.rules
